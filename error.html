<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>DSH 桌面端 - 出错了</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #10151c; color: #d6dee8; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    .box { text-align: center; max-width: 560px; padding: 24px; }
    h1 { font-size: 20px; margin: 0 0 12px; color: #ffb454; }
    p { font-size: 13px; line-height: 1.7; color: #a8b3c0; word-break: break-all; }
    button { margin-top: 20px; padding: 8px 28px; font-size: 14px; cursor: pointer;
             background: #2b6cb0; color: #fff; border: none; border-radius: 6px; }
    button:hover { background: #2f7fd0; }
  </style>
</head>
<body>
  <div class="box">
    <h1>DSH 服务出问题了</h1>
    <p id="msg">加载失败</p>
    <button onclick="window.dshDesktop && window.dshDesktop.retry()">重试</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    document.getElementById('msg').textContent = q.get('msg') || '未知错误';
  </script>
</body>
</html>
